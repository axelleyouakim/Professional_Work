version: '3.8'  # Use version 3.8 or higher

services:
  mongodb:
    image: mongo:latest
    container_name: covid19-dataviz-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
