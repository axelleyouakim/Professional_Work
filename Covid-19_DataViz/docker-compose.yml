version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: covid_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: covid_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - covid_network

  redis:
    image: redis:alpine
    container_name: covid_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - covid_network

  backend:
    build:
      context: ./covid19-datavizback
      dockerfile: Dockerfile
    container_name: covid_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://root:example@mongodb:27017/covid_db?authSource=admin
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - covid_network

  frontend:
    build:
      context: ./covid19-datavizfront
      dockerfile: Dockerfile
    container_name: covid_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:5000/api
    depends_on:
      - backend
    networks:
      - covid_network

networks:
  covid_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
