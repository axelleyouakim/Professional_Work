version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: covid_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: covid_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - covid_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: covid_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - covid_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./covid19-datavizback
      dockerfile: Dockerfile
    container_name: covid_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://root:example@mongodb:27017/covid_db?authSource=admin
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - covid_network
    volumes:
      - ./covid19-datavizback:/app
      - /app/node_modules
    command: npm start

  frontend:
    build:
      context: ./covid19-datavizfront
      dockerfile: Dockerfile
    container_name: covid_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - covid_network
    volumes:
      - ./covid19-datavizfront:/app
      - /app/node_modules
      - /app/.next

networks:
  covid_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local